name: Docker Multi-Platform Build and Push to GHCR

on:
  push:
    branches:
      - main

env:
  BACKEND_IMAGE: ghcr.io/ahmetcanyilmaz2022/taskmanager-backend:latest
  FRONTEND_IMAGE: ghcr.io/ahmetcanyilmaz2022/taskmanager-frontend:latest

jobs:
  docker-build-push:
    runs-on: ubuntu-latest
    steps:
      # 1️⃣ Repo’yu checkout et
      - name: Checkout repository
        uses: actions/checkout@v3

      # 2️⃣ Docker Buildx setup
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      # 3️⃣ GHCR login (PAT kullan)
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_PAT }}

      # 4️⃣ Backend image multi-platform build & push
      - name: Build and push backend image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.BACKEND_IMAGE }}

      # 5️⃣ Frontend image multi-platform build & push
      - name: Build and push frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./frontend
          file: ./frontend/Dockerfile
          push: true
          platforms: linux/amd64,linux/arm64
          tags: ${{ env.FRONTEND_IMAGE }}
