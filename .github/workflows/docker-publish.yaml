name: Docker Build and Push to GHCR

on:
push:
branches:
- main

env:
BACKEND_IMAGE: ghcr.io/ahmetcanyilmaz2022/taskmanager-backend:latest
FRONTEND_IMAGE: ghcr.io/ahmetcanyilmaz2022/taskmanager-frontend:latest

jobs:
docker-build-push:
runs-on: ubuntu-latest
if: contains(github.event.head_commit.message, '[run-app]')  # Sadece commit mesajında [run-app] varsa çalışır
steps:
- name: Checkout repository
uses: actions/checkout@v3

  - name: Set up Docker Buildx
    uses: docker/setup-buildx-action@v3

  - name: Log in to GitHub Container Registry
    uses: docker/login-action@v3
    with:
      registry: ghcr.io
      username: ${{ github.actor }}
      password: ${{ secrets.GITHUB_TOKEN }}

  - name: Build and push backend image
    uses: docker/build-push-action@v5
    with:
      context: ./app
      file: ./Dockerfile
      push: true
      tags: ${{ env.BACKEND_IMAGE }}

  - name: Build and push frontend image
    uses: docker/build-push-action@v5
    with:
      context: ./frontend
      file: ./Dockerfile
      push: true
      tags: ${{ env.FRONTEND_IMAGE }}
```
