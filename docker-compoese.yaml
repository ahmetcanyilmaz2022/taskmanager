services:
backend:
build: .
container_name: backend
ports:
- "8000:8000"
environment:
DATABASE_URL: postgres://postgres:postgres@db:5432/taskdb
depends_on:
- db

db:
image: postgres:15
environment:
POSTGRES_DB: taskdb
POSTGRES_USER: postgres
POSTGRES_PASSWORD: postgres
ports:
- "5432:5432"
volumes:
- pgdata:/var/lib/postgresql/data

volumes:
pgdata:
